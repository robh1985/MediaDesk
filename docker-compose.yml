services:
  mediadesk:
    build:
      context: .
      # args:
      #   WITH_OFFICE: "true"      # LibreOffice, for Office documents in Preview (large)
      #   WITH_CALIBRE: "false"    # leave out Calibre (eBook Reader: AZW3, Word, RTF, ODT, LIT books)
    container_name: mediadesk
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Network shares in Files (Settings → Files → Network shares) are mounted by MediaDesk inside
    # the container, which needs permission for it. Uncomment these to use them:
    # cap_add:
    #   - SYS_ADMIN          # mounting (SMB, NFS, SFTP, WebDAV)
    #   - DAC_READ_SEARCH    # SMB
    # devices:
    #   - /dev/fuse          # SFTP and WebDAV
    # security_opt:
    #   - apparmor:unconfined  # Ubuntu / Debian hosts: AppArmor otherwise blocks mounting
    volumes:
      - ./config:/config
      # - /mnt/games:/games      # The Game Console: its root folder (then set GAMES_DIR below); writable, for saves
      # - /mnt/books:/books      # eBook Reader: your books (then set EBOOKS_DIR below); writable to add books from devices
      # Folders for the Files app: mount them here, then add the container path (e.g. /media) in Settings > Files.
      # - /mnt/media:/media
    environment:
      # Strongly recommended if the portal is reachable by anyone else.
      PORTAL_PASSWORD: "change-me"
      # Everything below is optional — you can also fill these in from Settings inside the portal.
      # RADARR_URL: "http://radarr:7878"
      # RADARR_API_KEY: ""
      # SONARR_URL: "http://sonarr:8989"
      # SONARR_API_KEY: ""
      # NZBGET_URL: "http://nzbget:6789"
      # NZBGET_USERNAME: "nzbget"
      # NZBGET_PASSWORD: ""
      # JELLYFIN_URL: "http://jellyfin:8096"
      # JELLYFIN_API_KEY: ""
      # PLEX_URL: "http://plex:32400"   # or use Settings → Plex → Sign in with Plex
      # PLEX_TOKEN: ""
      # GAMES_DIR: "/games"
      # EBOOKS_DIR: "/books"
      # PIKVM_URL: "https://pikvm.local"
      # PIKVM_USERNAME: "admin"
      # PIKVM_PASSWORD: ""
      # Optional browser-facing URLs for "Open in …" links, if different from the URLs above:
      # RADARR_PUBLIC_URL: "https://radarr.example.com"
